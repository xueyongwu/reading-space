<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的阅读空间</title>
<meta name="description" content="个人读书工作台：书架、阅读进度、读书笔记与知识库，数据保存在本机。">
<meta name="theme-color" content="#F5F1E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1D1A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="阅读空间">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
/* 页面渲染前先应用外观设置，避免闪烁 */
try {
  var r = document.documentElement, a = localStorage.getItem('rs-accent'), m = localStorage.getItem('rs-theme');
  if (a) r.setAttribute('data-accent', a);
  if (m === 'light' || m === 'dark') {
    r.setAttribute('data-theme', m);
    document.querySelectorAll('meta[name="theme-color"]').forEach(function (el) { el.setAttribute('content', m === 'dark' ? '#1B1D1A' : '#F5F1E8'); });
  }
} catch (e) {}
</script>
<style>
:root {
  --bg: #F5F1E8;
  --surface: #FFFDF8;
  --surface-2: #EFE9DC;
  --text: #2A2924;
  --muted: #857F72;
  --line: #E6DFCF;
  --primary: #2F5241;
  --primary-ink: #FFFDF8;
  --primary-soft: #E3EBE4;
  --accent: #A8844E;
  --accent-soft: rgba(168, 132, 78, .22);
  --danger: #A6473B;
  --heat0: #EFE9DC;
  --heat1: #D9E5DA;
  --heat2: #A9C6AE;
  --heat3: #6F9A7A;
  --heat4: #2F5241;
  --shadow: 0 1px 2px rgba(60, 50, 30, .05), 0 6px 18px rgba(60, 50, 30, .06);
  --serif: "Songti SC", "STSong", "Noto Serif SC", "Noto Serif CJK SC", "Source Han Serif SC", "SimSun", serif;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  color-scheme: light;
}
/* 深色：跟随系统且没手动选浅色时，或手动选了深色时 */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1B1D1A;
    --surface: #242723;
    --surface-2: #2E322D;
    --text: #E9E5DA;
    --muted: #9C978B;
    --line: #373B35;
    --primary: #8DB59A;
    --primary-ink: #16201A;
    --primary-soft: #2B3A30;
    --accent: #C9A66B;
    --accent-soft: rgba(201, 166, 107, .25);
    --danger: #D9776A;
    --heat0: #2E322D;
    --heat1: #33463A;
    --heat2: #47684F;
    --heat3: #66906F;
    --heat4: #8DB59A;
    --shadow: 0 1px 2px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1B1D1A;
  --surface: #242723;
  --surface-2: #2E322D;
  --text: #E9E5DA;
  --muted: #9C978B;
  --line: #373B35;
  --primary: #8DB59A;
  --primary-ink: #16201A;
  --primary-soft: #2B3A30;
  --accent: #C9A66B;
  --accent-soft: rgba(201, 166, 107, .25);
  --danger: #D9776A;
  --heat0: #2E322D;
  --heat1: #33463A;
  --heat2: #47684F;
  --heat3: #66906F;
  --heat4: #8DB59A;
  --shadow: 0 1px 2px rgba(0, 0, 0, .25);
  color-scheme: dark;
}
/* 主题色：默认墨绿，其余通过 <html data-accent> 切换 */
:root[data-accent="blue"] { --primary: #2E4A62; --primary-soft: #E1E8EE; --heat1: #D6E0E9; --heat2: #A7BCCD; --heat3: #6C8AA3; --heat4: #2E4A62; }
:root[data-accent="brown"] { --primary: #6B4A32; --primary-soft: #EEE5DA; --heat1: #E8DCCB; --heat2: #CDB596; --heat3: #9C7A58; --heat4: #6B4A32; }
:root[data-accent="plum"] { --primary: #5B3F5E; --primary-soft: #ECE4EC; --heat1: #E5DAE4; --heat2: #C5ACC3; --heat3: #8E6C8C; --heat4: #5B3F5E; }
:root[data-accent="ink"] { --primary: #33342F; --primary-soft: #E8E5DD; --heat1: #E2DED3; --heat2: #BDB8AB; --heat3: #7F7B70; --heat4: #33342F; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"])[data-accent="blue"] { --primary: #8FADC6; --primary-ink: #141B22; --primary-soft: #28333D; --heat1: #2F3B46; --heat2: #43586A; --heat3: #61809A; --heat4: #8FADC6; }
  :root:not([data-theme="light"])[data-accent="brown"] { --primary: #C9A585; --primary-ink: #1E1710; --primary-soft: #3A3028; --heat1: #3B322A; --heat2: #5A4A3A; --heat3: #876D54; --heat4: #C9A585; }
  :root:not([data-theme="light"])[data-accent="plum"] { --primary: #B99BB8; --primary-ink: #1C141C; --primary-soft: #352B35; --heat1: #382D38; --heat2: #544254; --heat3: #7E647D; --heat4: #B99BB8; }
  :root:not([data-theme="light"])[data-accent="ink"] { --primary: #CFCBC0; --primary-ink: #1B1D1A; --primary-soft: #33352F; --heat1: #353731; --heat2: #4D4F48; --heat3: #7A7B73; --heat4: #CFCBC0; }
}
:root[data-theme="dark"][data-accent="blue"] { --primary: #8FADC6; --primary-ink: #141B22; --primary-soft: #28333D; --heat1: #2F3B46; --heat2: #43586A; --heat3: #61809A; --heat4: #8FADC6; }
:root[data-theme="dark"][data-accent="brown"] { --primary: #C9A585; --primary-ink: #1E1710; --primary-soft: #3A3028; --heat1: #3B322A; --heat2: #5A4A3A; --heat3: #876D54; --heat4: #C9A585; }
:root[data-theme="dark"][data-accent="plum"] { --primary: #B99BB8; --primary-ink: #1C141C; --primary-soft: #352B35; --heat1: #382D38; --heat2: #544254; --heat3: #7E647D; --heat4: #B99BB8; }
:root[data-theme="dark"][data-accent="ink"] { --primary: #CFCBC0; --primary-ink: #1B1D1A; --primary-soft: #33352F; --heat1: #353731; --heat2: #4D4F48; --heat3: #7A7B73; --heat4: #CFCBC0; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--sans); font-size: 15px; line-height: 1.55;
  -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
[hidden] { display: none !important; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

#app {
  max-width: 560px; margin: 0 auto;
  padding: calc(var(--safe-t) + 14px) 16px calc(96px + var(--safe-b));
  min-height: 100dvh;
}

/* ---------- 页面头部 ---------- */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 6px 0 18px; }
.page-head h1 { font-family: var(--serif); font-size: 27px; font-weight: 700; margin: 0; letter-spacing: .04em; }
.page-head .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent;
  display: inline-flex; align-items: center; justify-content: center; color: var(--muted); flex: none;
}
.icon-btn:active { background: var(--surface-2); }
.back-row { display: flex; align-items: center; gap: 4px; margin: 0 0 8px -10px; }
.back-row span { color: var(--muted); font-size: 14px; }

/* ---------- 卡片与通用 ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
.card-title { display: flex; align-items: center; justify-content: space-between; margin: 0 0 12px; }
.card-title h2 { font-family: var(--serif); font-size: 18px; margin: 0; font-weight: 700; }
.card-title .more { color: var(--muted); font-size: 13px; padding: 6px 0 6px 10px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.serif { font-family: var(--serif); }

.banner {
  display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px;
  background: var(--primary-soft); color: var(--text); font-size: 14px; margin-bottom: 14px;
}
.banner.warn { background: var(--accent-soft); }
.banner .grow { flex: 1; }
.banner button { border: 0; background: transparent; color: var(--primary); font-weight: 600; padding: 6px 4px; white-space: nowrap; }
.banner.warn button { color: var(--accent); }

.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow); }
.stat .num { font-family: var(--serif); font-size: 30px; font-weight: 700; color: var(--primary); line-height: 1.15; }
.stat .num small { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 3px; font-family: var(--sans); }
.stat .lbl { color: var(--muted); font-size: 13px; }

.quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
.quick button {
  border: 1px solid var(--line); background: var(--surface); border-radius: 14px; min-height: 64px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  font-size: 13px; color: var(--text); box-shadow: var(--shadow);
}
.quick button svg { color: var(--primary); }
.quick button:active { transform: scale(.97); }

/* ---------- 日历 ---------- */
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.cal-head h2 { font-family: var(--serif); font-size: 18px; margin: 0; }
.cal-nav { display: flex; align-items: center; }
.cal-nav .m { font-size: 14px; min-width: 88px; text-align: center; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.cal-wd { text-align: center; font-size: 12px; color: var(--muted); padding: 2px 0 4px; }
.cal-day {
  position: relative; aspect-ratio: 1; border: 0; border-radius: 9px; background: var(--heat0);
  font-size: 13px; display: flex; align-items: center; justify-content: center; padding: 0; color: var(--text);
}
.cal-day.l1 { background: var(--heat1); }
.cal-day.l2 { background: var(--heat2); }
.cal-day.l3 { background: var(--heat3); color: #fff; }
.cal-day.l4 { background: var(--heat4); color: var(--primary-ink); }
.cal-day.today { box-shadow: inset 0 0 0 2px var(--accent); }
.cal-day.future { opacity: .4; }
.cal-day.blank { background: transparent; }
.cal-day .dot { position: absolute; bottom: 4px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--accent); }
.cal-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend { display: flex; align-items: center; gap: 3px; }
.legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.legend .ldot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin: 0 2px 0 8px; }

/* ---------- 书籍 ---------- */
.cover { position: relative; flex: none; border-radius: 4px 6px 6px 4px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,.15), inset 3px 0 0 rgba(0,0,0,.08); background: var(--surface-2); }
.cover.sm { width: 40px; height: 56px; }
.cover.md { width: 58px; height: 82px; }
.cover.lg { width: 104px; height: 148px; }
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
.gen-cover {
  position: absolute; inset: 0; background: linear-gradient(160deg, rgba(255,255,255,.10), rgba(0,0,0,.12)), var(--c);
  color: #F3EBD9; font-family: var(--serif); display: flex; justify-content: center; padding: 8% 0;
}
.gen-cover::before { content: ""; position: absolute; left: 7%; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,.18); }
.gen-cover span { writing-mode: vertical-rl; white-space: nowrap; text-overflow: ellipsis; letter-spacing: .12em; overflow: hidden; max-height: 100%; line-height: 1.1; font-weight: 700; }
.cover.sm .gen-cover span { font-size: 9px; }
.cover.md .gen-cover span { font-size: 12px; }
.cover.lg .gen-cover span { font-size: 18px; }

.book-list { display: flex; flex-direction: column; }
.book-row { display: flex; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.book-row:last-child { border-bottom: 0; }
.book-row .info { flex: 1; min-width: 0; }
.book-title { font-family: var(--serif); font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.book-meta { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prog { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; color: var(--muted); }
.bar { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--primary); border-radius: 3px; transition: width .3s; }
.badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px; background: var(--surface-2); color: var(--muted); margin-left: 6px; vertical-align: 2px; font-family: var(--sans); font-weight: 400; }
.badge.reading { background: var(--primary-soft); color: var(--primary); }
.badge.done { background: var(--accent-soft); color: var(--accent); }
.mini-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 18px; padding: 0 12px; height: 34px; font-size: 13px; color: var(--primary); flex: none; }
.mini-btn:active { background: var(--surface-2); }

/* ---------- 筛选条 ---------- */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 16px 10px; margin: 0 -16px 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 18px;
  padding: 0 14px; height: 36px; font-size: 14px; white-space: nowrap; color: var(--text);
}
.chip.on { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.chip em { font-style: normal; opacity: .65; margin-left: 4px; font-size: 12px; }

.search { position: relative; margin-bottom: 12px; }
.search input { padding-left: 40px !important; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); width: 20px; height: 20px; }

/* ---------- 笔记 ---------- */
.note { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
.note .chapter { font-size: 12px; color: var(--accent); margin-bottom: 8px; letter-spacing: .05em; }
.note blockquote { margin: 0 0 10px; padding: 2px 0 2px 12px; border-left: 3px solid var(--accent); font-family: var(--serif); font-size: 16px; line-height: 1.85; white-space: pre-wrap; }
.note .sec { margin-top: 8px; white-space: pre-wrap; }
.note .sec b { display: block; font-size: 12px; color: var(--muted); font-weight: 500; margin-bottom: 2px; }
.note .sec.act { background: var(--primary-soft); border-radius: 10px; padding: 8px 10px; }
.note .sec.act b { color: var(--primary); }
.note .topics { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.tag { font-size: 12px; padding: 2px 9px; border-radius: 10px; background: var(--surface-2); color: var(--muted); }
.note-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 13px; color: var(--muted); }
.note-foot .src { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.note-foot .src a { color: var(--primary); }
.note-foot .ops { display: flex; gap: 2px; flex: none; }
.note-foot .ops button { border: 0; background: transparent; color: var(--muted); padding: 8px 8px; font-size: 13px; }
.note-foot .ops button.del { color: var(--danger); }
mark { background: var(--accent-soft); color: inherit; border-radius: 3px; padding: 0 1px; }

.empty { text-align: center; padding: 36px 16px; color: var(--muted); }
.empty .t { font-family: var(--serif); font-size: 17px; color: var(--text); margin-bottom: 6px; }
.empty .btn { margin-top: 14px; }

/* ---------- 书籍详情 ---------- */
.hero { display: flex; gap: 18px; align-items: flex-start; margin-bottom: 16px; }
.hero .info { flex: 1; min-width: 0; padding-top: 4px; }
.hero h1 { font-family: var(--serif); font-size: 23px; margin: 0 0 4px; line-height: 1.3; word-break: break-word; }
.hero .meta { color: var(--muted); font-size: 14px; }
.hero .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.big-prog .pct { font-family: var(--serif); font-size: 34px; font-weight: 700; color: var(--primary); line-height: 1; }
.big-prog .bar { height: 10px; border-radius: 5px; margin: 12px 0 8px; }
.big-prog .bar > i { border-radius: 5px; }
.kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; text-align: center; }
.kv div { background: var(--bg); border-radius: 10px; padding: 8px 4px; }
.kv b { display: block; font-family: var(--serif); font-size: 17px; }
.kv span { font-size: 12px; color: var(--muted); }
.log-list { list-style: none; padding: 0; margin: 0; font-size: 14px; }
.log-list li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); }
.log-list li:last-child { border-bottom: 0; }

/* ---------- 按钮与表单 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; padding: 0 18px;
  border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font-size: 15px; font-weight: 500;
}
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.ghost { background: transparent; }
.btn.text-danger { color: var(--danger); }
.btn.block { width: 100%; }
.btn.sm { min-height: 38px; font-size: 14px; padding: 0 14px; border-radius: 10px; }
.btn:active { opacity: .85; }
.btn-row { display: flex; gap: 10px; }
.btn-row > .btn { flex: 1; }

.field { margin-bottom: 14px; }
.field > label, .field > .lbl { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.field .req { color: var(--danger); }
.field .hint { font-size: 12px; color: var(--muted); margin-top: 5px; }
.inp, .field input:not([type=radio]):not([type=file]), .field select, .field textarea {
  width: 100%; font-size: 16px; padding: 11px 12px; border-radius: 11px; border: 1px solid var(--line);
  background: var(--bg); color: var(--text); outline: none; min-height: 46px; -webkit-appearance: none; appearance: none;
}
.field textarea { min-height: 88px; resize: vertical; line-height: 1.6; }
.field textarea.serif { font-family: var(--serif); }
.inp:focus, .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--primary); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.seg.two { grid-template-columns: 1fr 1fr; }
.modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.modes button { height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 14px; }
.modes button.on { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); font-weight: 600; }
.set-label { font-size: 13px; color: var(--muted); margin: 0 0 8px; }
.swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.swatch { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--text); font: inherit; font-size: 13px; cursor: pointer; }
.swatch i { width: 28px; height: 28px; border-radius: 50%; background: var(--sw); box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .swatch i { background: var(--sw-d); } }
:root[data-theme="dark"] .swatch i { background: var(--sw-d); }
.swatch.on { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); font-weight: 600; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: flex; align-items: center; justify-content: center; height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 14px; }

<script>
'use strict';
/* =========================================================
 * 我的阅读空间 —— 纯前端个人读书工作台
 * 数据结构：
 *   books: { id, title, author, category, status, totalPages, readPages, maxPage(记录过的最高页数),
 *            startedAt, finishedAt, coverUrl, createdAt, updatedAt, sample? }
 *            progressMode('page'|'percent'), percent, maxPercent,   // 电子书按百分比记录
 *            wereadId?, source?('weread'), readingSeconds? }        // 来自微信读书同步
 *   notes: { id, bookId, chapter, excerpt, thought, action, topics[], date, createdAt, updatedAt, sample?, source?, wereadId? }
 *   logs : { id, bookId, date, pages, percent?, at, sample? }   // 每次进度增加记一条，日历和年度页数都从这里统计
 *   meta.wrIgnoredBooks / wrIgnoredNotes: 删除过的微信读书书籍 / 划线编号，再次同步时不会重新加回来
 *   covers: { [bookId]: dataURL }                    // 封面单独存放，避免每次保存都重写图片
 * 日期统一使用本地日期 YYYY-MM-DD，避免 UTC 导致早上 8 点前记到前一天。
 * ======================================================= */

const APP_ID = 'reading-space';
const SCHEMA = 1;
const STATUS = { reading: '在读', want: '想读', done: '已读', paused: '搁置' };
const STATUS_KEYS = ['reading', 'want', 'done', 'paused'];
const DEFAULT_CATS = ['文学', '历史', '哲学', '心理', '经济', '商业', '科技', '传记', '艺术', '其他'];
const COVER_COLORS = ['#2F5241', '#5B4636', '#3D4F63', '#7A3E3E', '#4F5D3A', '#6B5B3E', '#3E4A4A', '#5A4A62'];
const BACKUP_REMIND_DAYS = 14;

/* ---------- 工具函数 ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = (n) => String(n).padStart(2, '0');
const dateKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => dateKey(new Date());
const nowISO = () => new Date().toISOString();
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return dateKey(d); };
const isoAt = (k, h = 21) => { const d = parseKey(k); d.setHours(h, 0, 0, 0); return d.toISOString(); };
const daysBetween = (a, b) => Math.round((parseKey(b) - parseKey(a)) / 86400000);
const isDateKey = (s) => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
const posInt = (v) => { const n = parseInt(String(v ?? '').trim(), 10); return Number.isFinite(n) && n > 0 ? n : 0; };
function fmtDate(k, withYear) {
  if (!k) return '';
  const d = parseKey(k);
  const showY = withYear || d.getFullYear() !== new Date().getFullYear();
  return `${showY ? d.getFullYear() + '年' : ''}${d.getMonth() + 1}月${d.getDate()}日`;
}
function coverColor(title) {
  let h = 0;
  for (const ch of String(title)) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  return COVER_COLORS[h % COVER_COLORS.length];
}
const ICON = {
  plus: '<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  book: '<svg class="i" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg>',
  prog: '<svg class="i" viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>',
  pen: '<svg class="i" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>',
  gear: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  back: '<svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  left: '<svg class="i" viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></svg>',
  right: '<svg class="i" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></svg>',
  search: '<svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>',
};

/* ---------- 本地存储：优先 IndexedDB，失败退回 localStorage ---------- */
const kv = (() => {
  let db = null;
  let mode = 'memory';
  const mem = {};
  const wrap = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  return {
    get mode() { return mode; },
    async init() {
      try {
        if (!window.indexedDB) throw new Error('no idb');
        db = await new Promise((res, rej) => {
          const r = indexedDB.open('reading-space', 1);
          r.onupgradeneeded = () => r.result.createObjectStore('kv');
          r.onsuccess = () => res(r.result);
          r.onerror = () => rej(r.error);
          r.onblocked = () => rej(new Error('blocked'));
        });
        mode = 'idb';
        return;
      } catch (e) { /* 退回 localStorage */ }
      try { localStorage.setItem('rs:t', '1'); localStorage.removeItem('rs:t'); mode = 'local'; } catch (e) { mode = 'memory'; }
    },
    async get(k) {
      if (mode === 'idb') return wrap(db.transaction('kv').objectStore('kv').get(k));
      if (mode === 'local') { const v = localStorage.getItem('rs:' + k); return v == null ? undefined : JSON.parse(v); }
      return mem[k];
    },
    async set(k, v) {
      if (mode === 'idb') {
        return new Promise((res, rej) => {
          const tx = db.transaction('kv', 'readwrite');
          tx.objectStore('kv').put(v, k);
          tx.oncomplete = () => res();
          tx.onerror = () => rej(tx.error);
          tx.onabort = () => rej(tx.error);
        });
      }
      if (mode === 'local') { localStorage.setItem('rs:' + k, JSON.stringify(v)); return; }
      mem[k] = JSON.parse(JSON.stringify(v));
    },
  };
})();

/* ---------- 应用状态 ---------- */
let S = emptyState();
let covers = {};
const ui = { calMonth: null, shelfStatus: 'all', shelfCat: '', notesBook: '', kbQuery: '', kbTopic: '', route: 'home', param: '' };

function emptyState() {
  return { version: SCHEMA, books: [], notes: [], logs: [], meta: { seeded: true, lastExportAt: null, hideA2HS: false, wrIgnoredBooks: [], wrIgnoredNotes: [], lastWereadSync: null } };
}

let saveChain = Promise.resolve();
function save(withCovers = false) {
  saveChain = saveChain
    .then(async () => {
      await kv.set('state', S);
      if (withCovers) await kv.set('covers', covers);
    })
    .catch((err) => {
      console.error(err);
      const full = err && (err.name === 'QuotaExceededError' || /quota/i.test(err.message || ''));
      toast(full ? '保存失败：存储空间不足，请删除部分封面或导出备份' : '保存失败，请尽快导出备份');
    });
  return saveChain;
}

/* ---------- 数据查询 ---------- */
const bookById = (id) => S.books.find((b) => b.id === id);
const notesOf = (id) => S.notes.filter((n) => n.bookId === id);
const logsOf = (id) => S.logs.filter((l) => l.bookId === id);
const isPct = (b) => b.progressMode === 'percent';
// 百分比模式下记录过的最高百分比（往回改不会降低它）
const highWaterPct = (b) => Math.max(b.maxPercent || 0, b.percent || 0);
const clampPct = (v) => { const s = String(v ?? '').trim(); if (!s) return NaN; const n = Math.round(Number(s)); return Number.isFinite(n) ? Math.min(100, Math.max(0, n)) : NaN; };
const fmtHours = (sec) => (sec >= 3600 ? (sec / 3600).toFixed(1) + ' 小时' : Math.max(1, Math.round(sec / 60)) + ' 分钟');
function pct(b) {
  if (b.status === 'done') return 100;
  if (isPct(b)) return Math.min(100, Math.max(0, Math.round(b.percent || 0)));
  if (!b.totalPages) return 0;
  return Math.min(100, Math.round((b.readPages / b.totalPages) * 100));
}
// 这本书记录过的最高页数（往回改页数不会降低它）
const highWater = (b) => Math.max(b.maxPage || 0, b.readPages || 0);
function lastActivity(b) {
  let t = b.updatedAt || b.createdAt || '';
  for (const l of S.logs) if (l.bookId === b.id && l.at > t) t = l.at;
  for (const n of S.notes) if (n.bookId === b.id && n.updatedAt > t) t = n.updatedAt;
  return t;
}
const byRecent = (a, b) => (lastActivity(b) > lastActivity(a) ? 1 : -1);
const hasSample = () => S.books.some((b) => b.sample) || S.notes.some((n) => n.sample) || S.logs.some((l) => l.sample);
const realCount = () => S.books.filter((b) => !b.sample).length + S.notes.filter((n) => !n.sample).length;
function allTopics() {
  const m = new Map();
  for (const n of S.notes) for (const t of n.topics || []) m.set(t, (m.get(t) || 0) + 1);
  return [...m.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'zh'));
}
function allCategories() {
  const set = new Set(S.books.map((b) => b.category).filter(Boolean));
  return [...set];
}
function activityMap() {
  const m = {};
  const get = (k) => (m[k] ||= { pages: 0, pct: 0, logs: [], notes: [] });
  for (const l of S.logs) { const d = get(l.date); d.pages += l.pages || 0; d.pct += l.percent || 0; d.logs.push(l); }
  for (const n of S.notes) get(n.date).notes.push(n);
  return m;
}

/* ---------- 示例数据 ---------- */
function seedSample() {
  const t = today();
  const mk = (o) => {
    const at = isoAt(o.startedAt || addDays(t, -45), 20);
    return { id: uid(), author: '', category: '', status: 'want', totalPages: 0, readPages: 0, startedAt: null, finishedAt: null, coverUrl: '', createdAt: at, updatedAt: at, sample: true, ...o };
  };
  const b1 = mk({ title: '活着', author: '余华', category: '文学', status: 'done', totalPages: 191, readPages: 191, startedAt: addDays(t, -40), finishedAt: addDays(t, -31) });
  const b2 = mk({ title: '人类简史', author: '尤瓦尔·赫拉利', category: '历史', status: 'reading', totalPages: 440, readPages: 210, startedAt: addDays(t, -22) });
  const b3 = mk({ title: '被讨厌的勇气', author: '岸见一郎 / 古贺史健', category: '心理', status: 'reading', totalPages: 296, readPages: 96, startedAt: addDays(t, -9) });
  const b4 = mk({ title: '置身事内', author: '兰小欢', category: '经济', status: 'want', totalPages: 336 });
  const logs = [];
  const L = (b, rows) => rows.forEach(([d, p]) => { const date = addDays(t, d); logs.push({ id: uid(), bookId: b.id, date, pages: p, at: isoAt(date), sample: true }); });
  L(b1, [[-40, 30], [-39, 25], [-37, 40], [-35, 32], [-33, 34], [-31, 30]]);
  L(b2, [[-22, 24], [-21, 18], [-19, 30], [-17, 22], [-15, 26], [-14, 15], [-12, 20], [-10, 18], [-7, 12], [-5, 25]]);
  L(b3, [[-9, 20], [-8, 16], [-6, 22], [-4, 18], [-2, 10], [-1, 10]]);
  const N = (b, d, o) => { const date = addDays(t, d); const at = isoAt(date, 22); return { id: uid(), bookId: b.id, chapter: '', excerpt: '', thought: '', action: '', topics: [], date, createdAt: at, updatedAt: at, sample: true, ...o }; };
  const notes = [
    N(b1, -31, { chapter: '中文版自序', excerpt: '人是为活着本身而活着，而不是为了活着之外的任何事物所活着。', thought: '福贵几乎失去了一切，却仍然活下去。活着本身就是意义，不必总向外寻找理由。', action: '少用“有没有意义”去评判日子，先把每一天过好。', topics: ['人生', '苦难'] }),
    N(b2, -19, { chapter: '第二章 知善恶树', excerpt: '（示例摘录）虚构的故事让大量互不相识的人能够彼此合作。', thought: '公司、国家、货币都建立在“共同想象”之上，理解这一点后，很多社会现象都好解释了。', action: '读新闻时多问一句：背后是哪一种共同想象在起作用？', topics: ['认知', '社会'] }),
    N(b2, -12, { chapter: '第五章 史上最大骗局', excerpt: '（示例摘录）农业革命让人口总量增加，却未必让个体过得更好。', thought: '进步和幸福并不是一回事。', topics: ['历史', '幸福'] }),
    N(b3, -6, { chapter: '第二夜', excerpt: '所有的烦恼都来自人际关系。', thought: '很多焦虑其实来自在意别人的评价。分清“这是谁的课题”，能卸下不少包袱。', action: '纠结时先问自己：这是我的课题，还是别人的课题？', topics: ['心理', '人际关系'] }),
    N(b3, -2, { chapter: '第四夜', thought: '“被讨厌的勇气”不是故意惹人讨厌，而是不为了讨好所有人而放弃自己。', action: '这周试着拒绝一件自己并不想做的事。', topics: ['心理', '自由'] }),
  ];
  b1.updatedAt = isoAt(b1.finishedAt);
  S = { version: SCHEMA, books: [b1, b2, b3, b4], notes, logs, meta: emptyState().meta };
}

/* ---------- 路由 ---------- */
function go(path) { if (location.hash !== '#/' + path) location.hash = '#/' + path; else render(); }
function parseRoute() {
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
  const [r, p = ''] = h.split('/');
  ui.route = ['home', 'shelf', 'notes', 'kb', 'book', 'settings'].includes(r) ? r : 'home';
  ui.param = p;
}
let navCount = 0;
window.addEventListener('hashchange', () => { navCount++; closeSheet(); parseRoute(); render(); window.scrollTo(0, 0); });

function render() {
  const app = $('#app');
  const views = { home: viewHome, shelf: viewShelf, notes: viewNotes, kb: viewKB, book: viewBook, settings: viewSettings };
  app.innerHTML = views[ui.route]();
  const tab = { book: 'shelf', settings: 'home' }[ui.route] || ui.route;
  $$('.tabbar a').forEach((a) => a.classList.toggle('on', a.dataset.tab === tab));
  if (ui.route === 'kb') bindKB();
  if (ui.route === 'settings') fillSettingsInfo();
}

/* ---------- 视图：首页 ---------- */
function greeting() {
  const h = new Date().getHours();
  return h < 5 ? '夜深了' : h < 11 ? '早上好' : h < 13 ? '中午好' : h < 18 ? '下午好' : '晚上好';
}
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

function viewHome() {

  const d = new Date();

  if (isIOS() && !isStandalone() && !S.meta.hideA2HS) {
    banners += `<div class="banner warn"><div class="grow">建议先<b>添加到主屏幕</b>再开始记录：iPhone 上 Safari 与主屏幕图标的数据互不相通。</div><button data-act="a2hs-help">怎么做</button><button data-act="a2hs-hide" aria-label="不再提示">×</button></div>`;

  const recent = S.books.filter((b) => b.status !== 'want').sort((a, b) => {

    <div class="stat"><div class="num">${S.notes.length}<small>条</small></div><div class="lbl">笔记总数</div></div>
    <div class="stat"><div class="num">${pagesYear.toLocaleString()}<small>页</small></div><div class="lbl">${y} 年阅读页数</div></div>
  </section>
  <section class="quick">

  <section class="card" id="cal-card">${calendarHTML()}</section>
  <section class="card">
    <div class="card-title"><h2>最近阅读</h2><a class="more" href="#/shelf">全部书籍 ›</a></div>

      `<div class="empty"><div class="t">还没有在读的书</div><div class="small">从添加第一本书开始吧</div><button class="btn primary" data-act="add-book">${ICON.plus}添加书籍</button></div>`}
  </section>`;
}

function calendarHTML() {
  const t = today();
  if (!ui.calMonth) { const n = new Date(); ui.calMonth = new Date(n.getFullYear(), n.getMonth(), 1); }
  const m = ui.calMonth;
  const year = m.getFullYear(), month = m.getMonth();
  const offset = (m.getDay() + 6) % 7; // 周一开头
  const days = new Date(year, month + 1, 0).getDate();
  const act = activityMap();
  let cells = '';
  for (let i = 0; i < offset; i++) cells += '<div class="cal-day blank"></div>';
  let readDays = 0, pages = 0, noteCnt = 0;
  for (let d = 1; d <= days; d++) {
    const k = `${year}-${pad(month + 1)}-${pad(d)}`;
    const a = act[k];
    let lv = 0;
    if (a) {
      pages += a.pages; noteCnt += a.notes.length;
      if (a.pages > 0 || a.pct > 0 || a.notes.length) readDays++;
      lv = a.pages > 100 ? 4 : a.pages > 50 ? 3 : a.pages > 20 ? 2 : (a.pages > 0 || a.pct > 0 || a.notes.length) ? 1 : 0;
      if (a.pct >= 10 && lv < 2) lv = 2;
    }
    const cls = ['cal-day', lv ? 'l' + lv : '', k === t ? 'today' : '', k > t ? 'future' : ''].join(' ');
    const label = a ? `${d}日，读了${a.pages}页${a.pct ? `和${a.pct}%` : ''}，${a.notes.length}条笔记` : `${d}日，无记录`;
    cells += `<button class="${cls}" data-act="cal-day" data-date="${k}" aria-label="${label}">${d}${a && a.notes.length ? '<i class="dot"></i>' : ''}</button>`;
  }
  const now = new Date();
  const isCurrent = year === now.getFullYear() && month === now.getMonth();
  return `
  <div class="cal-head"><h2>阅读日历</h2>
    <div class="cal-nav">
      <button class="icon-btn" data-act="cal-prev" aria-label="上个月">${ICON.left}</button>
      <span class="m">${year}年${month + 1}月</span>
      <button class="icon-btn" data-act="cal-next" aria-label="下个月" ${isCurrent ? 'disabled style="opacity:.3"' : ''}>${ICON.right}</button>
    </div>
  </div>
  <div class="cal-grid">${'一二三四五六日'.split('').map((w) => `<div class="cal-wd">${w}</div>`).join('')}${cells}</div>
  <div class="cal-foot">
    <span>本月阅读 <b>${readDays}</b> 天 · ${pages} 页 · ${noteCnt} 条笔记</span>
    <span class="legend">少<i style="background:var(--heat1)"></i><i style="background:var(--heat2)"></i><i style="background:var(--heat3)"></i><i style="background:var(--heat4)"></i>多<span class="ldot"></span>笔记</span>
  </div>`;
}

function coverHTML(b, size = 'md') {
  const src = covers[b.id] || b.coverUrl;
  const gen = `<div class="gen-cover" style="--c:${coverColor(b.title)}"><span>${esc(b.title)}</span></div>`;
  return `<div class="cover ${size}">${src ? `<img src="${esc(src)}" alt="" loading="lazy" onerror="this.remove()">` : ''}${gen}</div>`;
}

function bookRowHTML(b, withBtn) {
  const p = pct(b);
  const meta = [b.author, b.category].filter(Boolean).join(' · ') || '未填写作者';
  let progLine = '';
  if (b.status === 'done') progLine = `<div class="prog"><span>${b.finishedAt ? fmtDate(b.finishedAt) + ' 读完' : '已读完'}</span></div>`;
  else if (isPct(b) || b.totalPages) progLine = `<div class="prog"><div class="bar"><i style="width:${p}%"></i></div><span>${p}%</span></div>`;
  else progLine = `<div class="prog"><span>未填写总页数</span></div>`;

    <a class="info" href="#/book/${b.id}">

      <div class="book-meta">${esc(meta)}</div>${progLine}
    </a>${btn}
  </div>`;
}

/* ---------- 视图：笔记 ---------- */
function sortNotes(list) {
  return list.sort((a, b) => (a.date !== b.date ? (a.date < b.date ? 1 : -1) : (a.createdAt < b.createdAt ? 1 : -1)));
}
function viewNotes() {
  const withNotes = S.books.filter((b) => notesOf(b.id).length).sort(byRecent);
  if (ui.notesBook && !bookById(ui.notesBook)) ui.notesBook = '';
  const list = sortNotes(S.notes.filter((n) => !ui.notesBook || n.bookId === ui.notesBook));
  const chips = withNotes.length ? `<div class="chips"><button class="chip ${!ui.notesBook ? 'on' : ''}" data-act="notes-book" data-v="">全部<em>${S.notes.length}</em></button>${withNotes.map((b) => `<button class="chip ${ui.notesBook === b.id ? 'on' : ''}" data-act="notes-book" data-v="${b.id}">《${esc(b.title)}》<em>${notesOf(b.id).length}</em></button>`).join('')}</div>` : '';
  return `
  <header class="page-head"><div><h1>笔记</h1><div class="sub">${S.notes.length} 条笔记 · 来自 ${withNotes.length} 本书</div></div></header>
  ${chips}
  ${list.length ? list.map((n) => noteHTML(n)).join('') :
    `<div class="card empty"><div class="t">还没有笔记</div><div class="small">读到打动你的句子，就记下来吧</div><button class="btn primary" data-act="add-note" data-book="${ui.notesBook}">${ICON.pen}记一条笔记</button></div>`}
  <button class="fab" data-act="add-note" data-book="${ui.notesBook}">${ICON.pen}记笔记</button>`;
}

function hl(text, terms) {
  text = String(text || '');
  if (!terms || !terms.length) return esc(text);
  const low = text.toLowerCase();
  const marks = new Array(text.length).fill(false);
  for (const t of terms) {
    let i = 0;
    while ((i = low.indexOf(t, i)) !== -1) { for (let j = i; j < i + t.length; j++) marks[j] = true; i += t.length; }
  }
  let out = '', on = false;
  for (let i = 0; i < text.length; i++) {
    if (marks[i] && !on) { out += '<mark>'; on = true; }
    if (!marks[i] && on) { out += '</mark>'; on = false; }
    out += esc(text[i]);
  }
  return out + (on ? '</mark>' : '');
}

function noteHTML(n, terms = [], showSource = true) {
  const b = bookById(n.bookId);
  const src = b ? `<a href="#/book/${b.id}">《${hl(b.title, terms)}》</a>` : '<span>（书籍已删除）</span>';
  return `<article class="note">
    ${n.chapter ? `<div class="chapter">${hl(n.chapter, terms)}</div>` : ''}
    ${n.excerpt ? `<blockquote>${hl(n.excerpt, terms)}</blockquote>` : ''}
    ${n.thought ? `<div class="sec"><b>我的感悟</b>${hl(n.thought, terms)}</div>` : ''}
    ${n.action ? `<div class="sec act"><b>行动建议</b>${hl(n.action, terms)}</div>` : ''}
    ${n.topics && n.topics.length ? `<div class="topics">${n.topics.map((t) => `<span class="tag"># ${hl(t, terms)}</span>`).join('')}</div>` : ''}
    <div class="note-foot">
      <div class="src">${showSource ? src + ' · ' : ''}${fmtDate(n.date)}${n.source === 'weread' ? ' · 微信读书' : ''}</div>
      <div class="ops"><button data-act="edit-note" data-id="${n.id}">编辑</button><button class="del" data-act="del-note" data-id="${n.id}">删除</button></div>
    </div>
  </article>`;
}

/* ---------- 视图：知识库 ---------- */
function viewKB() {
  const topics = allTopics();
  if (ui.kbTopic && !topics.some(([t]) => t === ui.kbTopic)) ui.kbTopic = '';
  return `
  <header class="page-head"><div><h1>知识库</h1><div class="sub">汇总全部笔记，按关键词或主题查找</div></div></header>
  <div class="search">${ICON.search}<input class="inp" id="kb-q" type="search" placeholder="搜索摘录、感悟、行动、书名…" value="${esc(ui.kbQuery)}" enterkeyhint="search" autocomplete="off"></div>
  ${topics.length ? `<div class="chips" id="kb-topics">${kbTopicsHTML(topics)}</div>` : ''}
  <div id="kb-results">${kbResultsHTML()}</div>`;
}
function kbTopicsHTML(topics) {
  return `<button class="chip ${!ui.kbTopic ? 'on' : ''}" data-act="kb-topic" data-v="">全部主题</button>` +
    topics.map(([t, c]) => `<button class="chip ${ui.kbTopic === t ? 'on' : ''}" data-act="kb-topic" data-v="${esc(t)}"># ${esc(t)}<em>${c}</em></button>`).join('');
}
function kbResultsHTML() {
  const terms = ui.kbQuery.trim().toLowerCase().split(/\s+/).filter(Boolean);
  let list = S.notes.slice();
  if (ui.kbTopic) list = list.filter((n) => (n.topics || []).includes(ui.kbTopic));
  if (terms.length) {
    list = list.filter((n) => {
      const b = bookById(n.bookId);
      const hay = [n.chapter, n.excerpt, n.thought, n.action, (n.topics || []).join(' '), b ? b.title : '', b ? b.author : ''].join('\n').toLowerCase();
      return terms.every((t) => hay.includes(t));
    });
  }
  sortNotes(list);
  if (!S.notes.length) return `<div class="card empty"><div class="t">知识库还是空的</div><div class="small">你记下的每一条笔记都会自动汇总到这里</div><button class="btn primary" data-act="add-note">${ICON.pen}记一条笔记</button></div>`;
  if (!list.length) return `<div class="card empty"><div class="t">没有找到相关笔记</div><div class="small">换个关键词，或者切换主题试试</div></div>`;
  const books = new Set(list.map((n) => n.bookId)).size;
  return `<div class="small muted" style="margin:0 2px 10px">找到 ${list.length} 条笔记 · 来自 ${books} 本书</div>` + list.map((n) => noteHTML(n, terms)).join('');
}
function bindKB() {
  const q = $('#kb-q');
  if (!q) return;
  let composing = false;
  const update = () => { ui.kbQuery = q.value; $('#kb-results').innerHTML = kbResultsHTML(); };
  q.addEventListener('compositionstart', () => { composing = true; });
  q.addEventListener('compositionend', () => { composing = false; update(); });
  q.addEventListener('input', () => { if (!composing) update(); });
  q.addEventListener('keydown', (e) => { if (e.key === 'Enter') q.blur(); });
}

/* ---------- 视图：书籍详情 ---------- */
function viewBook() {
  const b = bookById(ui.param);
  if (!b) return `<div class="back-row"><a class="icon-btn" href="#/shelf">${ICON.back}</a><span>书架</span></div><div class="card empty"><div class="t">这本书不存在或已被删除</div></div>`;
  const p = pct(b);
  const notes = sortNotes(notesOf(b.id));
  const logs = logsOf(b.id).sort((x, y) => (x.date !== y.date ? (x.date < y.date ? 1 : -1) : (x.at < y.at ? 1 : -1)));
  const pctMode = isPct(b);
  const logged = logs.reduce((s, l) => s + (pctMode ? l.percent || 0 : l.pages || 0), 0);
  const days = new Set([...logs.map((l) => l.date), ...notes.map((n) => n.date)]).size;
  const dates =`${b.startedAt ? ' · ' + fmtDate(b.startedAt, true) + ' 开始' : ''}${b.finishedAt ? ' · ' + fmtDate(b.finishedAt, true) + ' 读完' : ''}`;
  const progText = pctMode ? `已读 ${b.status === 'done' ? 100 : Math.round(b.percent || 0)}%${dates}` : `已读 ${b.readPages} / ${b.totalPages || '?'} 页${dates}`;
  const showPct = pctMode || b.totalPages || b.status === 'done';
  const logText = (l) => (l.percent ? `读了 ${l.percent}%` : `读了 ${l.pages} 页`);
  return `
  <div class="back-row"><button class="icon-btn" data-act="back" aria-label="返回">${ICON.back}</button><span>返回</span></div>

    ${coverHTML(b, 'lg')}
    <div class="info">

      <div class="meta">${esc(b.author || '未填写作者')}</div>

    </div>
  </section>
  <section class="card big-prog">
    <div class="card-title"><h2>阅读进度</h2><button class="mini-btn" data-act="progress" data-id="${b.id}">${b.status !== 'done' ? '更新进度' : pctMode ? '修改进度' : '修改页数'}</button></div>
    <div class="pct">${showPct ? p + '<small style="font-size:16px">%</small>' : '<span style="font-size:18px">未填写总页数</span>'}</div>
    <div class="bar"><i style="width:${p}%"></i></div>
    <div class="small muted">${progText}</div>
    <div class="kv"><div><b>${days}</b><span>阅读天数</span></div>${b.readingSeconds ? `<div><b>${fmtHours(b.readingSeconds)}</b><span>微信读书累计</span></div>` : `<div><b>${logged}${pctMode ? '%' : ''}</b><span>${pctMode ? '记录进度' : '记录页数'}</span></div>`}<div><b>${notes.length}</b><span>笔记</span></div></div>
  </section>
  <section>
    <div class="card-title" style="padding:0 2px"><h2>读书笔记</h2><button class="mini-btn" data-act="add-note" data-book="${b.id}">＋ 记一条</button></div>
    ${notes.length ? notes.map((n) => noteHTML(n, [], false)).join('') : `<div class="card empty"><div class="small">这本书还没有笔记</div></div>`}
  </section>

const THEME_MODES = [
  { key: 'system', name: '跟随系统' },
  { key: 'light', name: '浅色' },
  { key: 'dark', name: '深色' },
];
function currentTheme() {
  const v = document.documentElement.getAttribute('data-theme');
  return v === 'light' || v === 'dark' ? v : 'system';
}
function setTheme(mode) {
  const root = document.documentElement;
  if (mode === 'light' || mode === 'dark') root.setAttribute('data-theme', mode);
  else { mode = 'system'; root.removeAttribute('data-theme'); }
  // 状态栏 / 地址栏颜色跟着变
  const metas = document.querySelectorAll('meta[name="theme-color"]');
  metas.forEach((el) => {
    const forDark = (el.getAttribute('media') || '').includes('dark');
    el.setAttribute('content', mode === 'system' ? (forDark ? '#1B1D1A' : '#F5F1E8') : mode === 'dark' ? '#1B1D1A' : '#F5F1E8');
  });
  try { if (mode === 'system') localStorage.removeItem('rs-theme'); else localStorage.setItem('rs-theme', mode); } catch (e) { /* 存不了就只在本次生效 */ }
}
const ACCENTS = [
  { key: 'green', name: '墨绿', color: '#2F5241', dark: '#8DB59A' },
  { key: 'blue', name: '黛蓝', color: '#2E4A62', dark: '#8FADC6' },
  { key: 'brown', name: '檀褐', color: '#6B4A32', dark: '#C9A585' },
  { key: 'plum', name: '绛紫', color: '#5B3F5E', dark: '#B99BB8' },
  { key: 'ink', name: '墨色', color: '#33342F', dark: '#CFCBC0' },
];
function currentAccent() {
  const v = document.documentElement.getAttribute('data-accent');
  return ACCENTS.some((a) => a.key === v) ? v : 'green';
}
function setAccent(key) {
  if (!ACCENTS.some((a) => a.key === key)) key = 'green';
  if (key === 'green') document.documentElement.removeAttribute('data-accent');
  else document.documentElement.setAttribute('data-accent', key);
  try { if (key === 'green') localStorage.removeItem('rs-accent'); else localStorage.setItem('rs-accent', key); } catch (e) { /* 存不了就只在本次生效 */ }
}

function openSheet(title, html, onMount) {

function dialog(title, msg, buttons) {
  return new Promise((resolve) => {
    const el = document.createElement('div');
    el.className = 'dialog-mask';
    el.innerHTML = `<div class="dialog" role="alertdialog" aria-modal="true"><h3>${esc(title)}</h3><p>${msg}</p>
      <div class="btns ${buttons.length === 2 ? 'two' : ''}">${buttons.map((b, i) => `<button class="btn ${b.cls || ''}" data-i="${i}">${esc(b.label)}</button>`).join('')}</div></div>`;
    el.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-i]');
      if (!btn && e.target !== el) return;
      e.stopPropagation();
      el.remove();
      resolve(btn ? buttons[+btn.dataset.i].value : null);
    });
    document.body.appendChild(el);
    const first = el.querySelector('.btn.primary, .btn.danger');
    if (first) first.focus({ preventScroll: true });
  });
}
const confirmBox = (title, msg, okLabel = '确定', danger = false) =>
  dialog(title, msg, [{ label: okLabel, value: true, cls: danger ? 'danger' : 'primary' }, { label: '取消', value: false, cls: 'ghost' }]);

let toastTimer = null;

/* ---------- 图片压缩 ---------- */
function pickImage() {
  return new Promise((resolve) => {
    const input = $('#file-cover');
    input.value = '';
    input.onchange = () => resolve(input.files && input.files[0]);
    input.click();
  });
}
async function compressImage(file, maxW = 360, maxH = 540, quality = 0.78) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const scale = Math.min(1, maxW / img.naturalWidth, maxH / img.naturalHeight);
    const w = Math.max(1, Math.round(img.naturalWidth * scale)), h = Math.max(1, Math.round(img.naturalHeight * scale));
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);
    return c.toDataURL('image/jpeg', quality);
  } finally { URL.revokeObjectURL(url); }
}

      toast(b ? '已保存' : `已添加《${title}》`);

    });

async function deleteBook(id) {
  const b = bookById(id);
  if (!b) return;
  const n = notesOf(id).length, l = logsOf(id).length;
  const extra = n || l ? `<br>将同时删除这本书的 <b>${n}</b> 条笔记和 <b>${l}</b> 条阅读记录，日历和统计会相应减少。` : '';
  const wrTip = b.wereadId ? '<br>这本书来自微信读书，以后同步也不会再加回来。' : '';
  if (!(await confirmBox('删除这本书？', `《${esc(b.title)}》删除后无法恢复。${extra}${wrTip}`, '删除', true))) return;
  if (b.wereadId) S.meta.wrIgnoredBooks = [...new Set([...(S.meta.wrIgnoredBooks || []), b.wereadId])];
  S.books = S.books.filter((x) => x.id !== id);
  S.notes = S.notes.filter((x) => x.bookId !== id);
  S.logs = S.logs.filter((x) => x.bookId !== id);
  delete covers[id];
  save(true);
  toast('已删除');
  if (ui.route === 'book') go('shelf'); else render();
}

  const others = S.books.filter((b) => b.status === 'want' || b.status === 'paused').sort(byRecent);
  if (list.length === 1 && !others.length) { openProgress(list[0].id); return; }
  const row = (b) => `<button data-act="progress" data-id="${b.id}">${coverHTML(b, 'sm')}<div style="flex:1;min-width:0"><div class="book-title" style="font-size:16px">${esc(b.title)}</div><div class="small muted">${isPct(b) ? `已读 ${pct(b)}%` : b.totalPages ? `已读 ${b.readPages}/${b.totalPages} 页 · ${pct(b)}%` : STATUS[b.status]}</div></div></button>`;
  let html = '';
  if (list.length) html += `<div class="small muted">在读</div><div class="pick-list">${list.map(row).join('')}</div>`;
  if (others.length) html += `<div class="small muted" style="margin-top:12px">想读 / 搁置（记录进度后会变为在读）</div><div class="pick-list">${others.map(row).join('')}</div>`;
  if (!html) html = `<div class="empty"><div class="small">没有需要更新进度的书</div><button class="btn primary" data-act="add-book">添加书籍</button></div>`;
  openSheet('选择要更新的书', html);
}

// 电子书：按百分比更新进度
function openProgressPct(b) {
  const t = today();
  const cur = Math.round(b.percent || 0);
  const html = `
  <form id="prog-form" novalidate>
    <div style="display:flex;gap:12px;align-items:center;margin-bottom:16px">${coverHTML(b, 'sm')}<div style="min-width:0"><div class="book-title">${esc(b.title)}</div><div class="small muted">当前已读 ${cur}%</div></div></div>
    <div class="field"><label for="pf-pct">今天读到百分之几</label><input id="pf-pct" name="pct" type="number" inputmode="numeric" pattern="[0-9]*" min="0" max="100" value="${cur || ''}" placeholder="${cur}"></div>
    <div class="quick-add"><button type="button" class="btn sm" data-add="5">+5%</button><button type="button" class="btn sm" data-add="10">+10%</button><button type="button" class="btn sm" data-add="20">+20%</button><button type="button" class="btn sm" data-add="all">读完</button></div>
    <div class="field"><label for="pf-date">阅读日期</label><input id="pf-date" name="date" type="date" max="${t}" value="${t}"><div class="hint">只有进度增加时才会计入阅读日历。电子书没有页码，不计入年度阅读页数。</div></div>
    <button class="btn primary block" type="submit">保存进度</button>
  </form>`;
  openSheet('更新阅读进度', html, (root) => {
    const form = $('#prog-form', root);
    const fe = form.elements;
    $$('[data-add]', root).forEach((btn) => btn.addEventListener('click', () => {
      if (btn.dataset.add === 'all') { fe.pct.value = 100; return; }
      const v = clampPct(fe.pct.value);
      fe.pct.value = Math.min(100, (Number.isNaN(v) ? cur : v) + parseInt(btn.dataset.add, 10));
    }));
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const v = clampPct(fe.pct.value);
      if (Number.isNaN(v)) { toast('请输入 0–100 之间的数字'); fe.pct.focus(); return; }
      const date = isDateKey(fe.date.value) ? fe.date.value : t;
      if (date > today()) { toast('不能记录未来的日期'); return; }
      const base = highWaterPct(b);
      const delta = v - base;
      const forward = v > (b.percent || 0);
      b.percent = v;
      b.maxPercent = Math.max(base, v);
      b.updatedAt = nowISO();
      delete b.sample;
      let msg = delta > 0 ? `已记录：读了 ${delta}%` : forward ? '进度已更新（这部分之前已记过，不重复计入日历）' : '进度已修改（未增加，不计入日历）';
      if (delta > 0) {
        S.logs.push({ id: uid(), bookId: b.id, date, pages: 0, percent: delta, at: nowISO() });
        if (!b.startedAt || date < b.startedAt) b.startedAt = date;
      }
      if (forward && (b.status === 'want' || b.status === 'paused')) b.status = 'reading';
      if (v >= 100 && b.status !== 'done') { b.status = 'done'; b.finishedAt = date; msg = `恭喜读完《${b.title}》！`; }
      save();
      closeSheet();
      toast(msg);
      render();
    });
  });
}

function openProgress(id) {
  const b = bookById(id);
  if (!b) return;
  if (isPct(b)) { openProgressPct(b); return; }
  const t = today();
  const html = `
  <form id="prog-form" novalidate>
    <div style="display:flex;gap:12px;align-items:center;margin-bottom:16px">${coverHTML(b, 'sm')}<div style="min-width:0"><div class="book-title">${esc(b.title)}</div><div class="small muted">当前已读 ${b.readPages}${b.totalPages ? ' / ' + b.totalPages : ''} 页${b.totalPages ? ' · ' + pct(b) + '%' : ''}</div></div></div>
    ${b.totalPages ? '' : `<div class="field"><label for="pf-total">总页数 <span class="req">*</span></label><input id="pf-total" name="total" type="number" inputmode="numeric" pattern="[0-9]*" placeholder="填写后才能计算百分比"></div>`}
    <div class="field"><label for="pf-page">今天读到第几页</label><input id="pf-page" name="page" type="number" inputmode="numeric" pattern="[0-9]*" min="0" value="${b.readPages || ''}" placeholder="${b.readPages}"></div>
    <div class="quick-add"><button type="button" class="btn sm" data-add="10">+10</button><button type="button" class="btn sm" data-add="20">+20</button><button type="button" class="btn sm" data-add="50">+50</button><button type="button" class="btn sm" data-add="all">读完</button></div>
    <div class="field"><label for="pf-date">阅读日期</label><input id="pf-date" name="date" type="date" max="${t}" value="${t}"><div class="hint">忘了记录可以改成实际读书的那天。只有页数增加时才会计入阅读日历。</div></div>
    <button class="btn primary block" type="submit">保存进度</button>
  </form>`;
  openSheet('更新阅读进度', html, (root) => {
    const form = $('#prog-form', root);
    const fe = form.elements;
    const getTotal = () => b.totalPages || posInt(fe.total && fe.total.value);
    $$('[data-add]', root).forEach((btn) => btn.addEventListener('click', () => {
      const total = getTotal();
      const cur = parseInt(fe.page.value, 10) || b.readPages || 0;
      if (btn.dataset.add === 'all') {
        if (!total) { toast('请先填写总页数'); fe.total && fe.total.focus(); return; }
        fe.page.value = total;
      } else {
        let v = cur + parseInt(btn.dataset.add, 10);
        if (total && v > total) v = total;
        fe.page.value = v;
      }
    }));
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const total = getTotal();
      if (!total) { toast('请先填写总页数'); fe.total && fe.total.focus(); return; }
      let page = parseInt(fe.page.value, 10);
      if (!Number.isFinite(page) || page < 0) { toast('请输入正确的页码'); fe.page.focus(); return; }
      if (page > total) page = total;
      const date = isDateKey(fe.date.value) ? fe.date.value : t;
      if (date > today()) { toast('不能记录未来的日期'); return; }
      // 只有超过「记录过的最高页数」的部分才计入，往回改页数后再往前读不会重复计算
      const base = highWater(b);
      const delta = page - base;
      const forward = page > b.readPages;
      b.totalPages = total;
      b.readPages = page;
      b.maxPage = Math.max(base, page);
      b.updatedAt = nowISO();
      delete b.sample;
      let msg = delta > 0 ? `已记录：读了 ${delta} 页` : forward ? '进度已更新（这些页之前已记过，不重复计入日历）' : '页数已修改（未增加，不计入日历）';
      if (delta > 0) {
        S.logs.push({ id: uid(), bookId: b.id, date, pages: delta, at: nowISO() });
        if (!b.startedAt || date < b.startedAt) b.startedAt = date;
      }
      if (forward && (b.status === 'want' || b.status === 'paused')) b.status = 'reading';
      if (page >= total && b.status !== 'done') { b.status = 'done'; b.finishedAt = date; msg = `恭喜读完《${b.title}》！`; }
      save();
      closeSheet();
      toast(msg);
      render();
    });
  });
}

/* ---------- 表单：笔记 ---------- */
function openNoteForm(id, bookId) {
  const n = id ? S.notes.find((x) => x.id === id) : null;
  if (!n && !S.books.length) { toast('先添加一本书，再记笔记'); openBookForm(); return; }
  const books = S.books.slice().sort((a, b) => {
    if ((a.status === 'reading') !== (b.status === 'reading')) return a.status === 'reading' ? -1 : 1;
    return byRecent(a, b);
  });
  const selected = n ? n.bookId : bookId && bookById(bookId) ? bookId : books[0].id;
  let topics = n ? [...(n.topics || [])] : [];
  const existing = allTopics().map(([t]) => t);
  const html = `
  <form id="note-form" novalidate>
    <div class="field"><label for="nf-book">书籍 <span class="req">*</span></label><select id="nf-book" name="book">${books.map((b) => `<option value="${b.id}" ${b.id === selected ? 'selected' : ''}>《${esc(b.title)}》${b.author ? ' ' + esc(b.author) : ''}</option>`).join('')}</select></div>
    <div class="field"><label for="nf-ch">章节</label><input id="nf-ch" name="chapter" value="${esc(n ? n.chapter : '')}" placeholder="例如：第三章 / P128" autocomplete="off"></div>
    <div class="field"><label for="nf-ex">摘录</label><textarea id="nf-ex" name="excerpt" class="serif" placeholder="书中打动你的原文">${esc(n ? n.excerpt : '')}</textarea></div>
    <div class="field"><label for="nf-th">个人感悟</label><textarea id="nf-th" name="thought" placeholder="读到这里，你想到了什么？">${esc(n ? n.thought : '')}</textarea></div>
    <div class="field"><label for="nf-ac">行动建议</label><textarea id="nf-ac" name="action" style="min-height:64px" placeholder="可以落到生活里的一件小事">${esc(n ? n.action : '')}</textarea></div>
    <div class="field"><div class="lbl">主题</div>
      <div class="topic-box" id="nf-topics"></div>
      <div class="sugg" id="nf-sugg"></div>
      <div class="hint">输入后按回车或逗号添加，可添加多个。</div>
    </div>
    <div class="field"><label for="nf-date">记录日期</label><input id="nf-date" name="date" type="date" max="${today()}" value="${n ? n.date : today()}"></div>
    <button class="btn primary block" type="submit">${n ? '保存修改' : '保存笔记'}</button>
  </form>`;
  openSheet(n ? '编辑笔记' : '记一条笔记', html, (root) => {
    const form = $('#note-form', root);
    const fe = form.elements;
    const box = $('#nf-topics', root);
    const sugg = $('#nf-sugg', root);
    let draft = '';
    const addTopic = (raw) => {
      for (const part of String(raw).split(/[,，、;；\s]+/)) {
        const t = part.replace(/^#+/, '').trim().slice(0, 20);
        if (t && !topics.includes(t)) topics.push(t);
      }
    };
    const draw = (focus) => {
      box.innerHTML = topics.map((t, i) => `<span class="t">${esc(t)}<button type="button" data-rm="${i}" aria-label="移除">×</button></span>`).join('') +
        `<input id="nf-tin" placeholder="${topics.length ? '' : '如：心理、人际关系'}" autocomplete="off" enterkeyhint="done">`;
      const s = existing.filter((t) => !topics.includes(t)).slice(0, 12);
      sugg.innerHTML = s.map((t) => `<button type="button" data-sg="${esc(t)}">+ ${esc(t)}</button>`).join('');
      const inp = $('#nf-tin', box);
      inp.value = draft;
      let composing = false;
      inp.addEventListener('compositionstart', () => { composing = true; });
      inp.addEventListener('compositionend', () => { composing = false; });
      inp.addEventListener('input', () => {
        draft = inp.value;
        if (!composing && /[,，、;；]/.test(inp.value)) { addTopic(inp.value); draft = ''; draw(true); }
      });
      inp.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.isComposing && !composing) { e.preventDefault(); if (inp.value.trim()) { addTopic(inp.value); draft = ''; draw(true); } }
        else if (e.key === 'Backspace' && !inp.value && topics.length) { topics.pop(); draw(true); }
      });
      inp.addEventListener('blur', () => { if (inp.value.trim()) { addTopic(inp.value); draft = ''; setTimeout(() => draw(false), 0); } });
      if (focus) inp.focus({ preventScroll: true });
    };
    box.addEventListener('click', (e) => {
      const rm = e.target.closest('[data-rm]');
      if (rm) { topics.splice(+rm.dataset.rm, 1); draw(false); return; }
      if (e.target === box) $('#nf-tin', box).focus();
    });
    sugg.addEventListener('click', (e) => {
      const sg = e.target.closest('[data-sg]');
      if (sg) { addTopic(sg.dataset.sg); draw(false); }
    });
    draw(false);
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const tin = $('#nf-tin', box);
      if (tin && tin.value.trim()) { addTopic(tin.value); draft = ''; }
      const data = {
        bookId: fe.book.value,
        chapter: fe.chapter.value.trim(),
        excerpt: fe.excerpt.value.trim(),
        thought: fe.thought.value.trim(),
        action: fe.action.value.trim(),
        topics: topics.slice(),
        date: isDateKey(fe.date.value) && fe.date.value <= today() ? fe.date.value : today(),
        updatedAt: nowISO(),
      };
      if (!bookById(data.bookId)) { toast('请选择书籍'); return; }
      if (!data.excerpt && !data.thought && !data.action) { toast('摘录、感悟、行动建议至少填一项'); fe.excerpt.focus(); return; }
      if (n) { Object.assign(n, data); delete n.sample; }
      else S.notes.push({ id: uid(), createdAt: data.updatedAt, ...data });
      save();
      closeSheet();
      toast(n ? '笔记已保存' : '已记下一条笔记');
      render();
    });
  });
}

async function deleteNote(id) {
  const n = S.notes.find((x) => x.id === id);
  if (!n) return;
  const preview = esc((n.excerpt || n.thought || n.action).slice(0, 40));
  if (!(await confirmBox('删除这条笔记？', `「${preview}${(n.excerpt || n.thought || n.action).length > 40 ? '…' : ''}」<br>删除后无法恢复。`, '删除', true))) return;
  if (n.wereadId) S.meta.wrIgnoredNotes = [...new Set([...(S.meta.wrIgnoredNotes || []), n.wereadId])];
  S.notes = S.notes.filter((x) => x.id !== id);
  save();
  toast('已删除');
  render();
}

/* ---------- 日历：某一天的记录 ---------- */
function openDay(k) {

    openSheet(title, `<div class="empty"><div class="small">${k > today() ? '这一天还没到' : '这一天没有阅读记录'}</div>${k <= today() ? `<button class="btn primary" data-act="pick-progress">记录阅读进度</button>` : ''}</div>`);

  }).join('');

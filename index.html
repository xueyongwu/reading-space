}

/* ---------- 导出 / 导入 ---------- */
const exportName = (ext = 'json') => `阅读空间备份-${today()}.${ext}`;
function buildExport() {
  return JSON.stringify({ app: APP_ID, version: SCHEMA, exportedAt: nowISO(), data: S, covers });
}
function markExported() { S.meta.lastExportAt = nowISO(); save(); }
async function exportShare() {
  const txt = buildExport();
  const candidates = [new File([txt], exportName('json'), { type: 'application/json' }), new File([txt], exportName('txt'), { type: 'text/plain' })];
  const file = navigator.canShare ? candidates.find((f) => { try { return navigator.canShare({ files: [f] }); } catch (e) { return false; } }) : null;
  if (!file) { toast('当前浏览器不支持分享文件，请用「下载文件」或「复制为文本」'); return; }
  try {
    await navigator.share({ files: [file], title: '我的阅读空间备份' });
    markExported(); render(); toast('已导出备份');
  } catch (e) {
    if (e.name !== 'AbortError') toast('分享失败，请改用「下载文件」或「复制为文本」');
  }
}
function exportDownload() {
  const blob = new Blob([buildExport()], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = exportName('json');
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  markExported(); render();
  toast('已开始下载备份文件');
}
async function exportCopy() {
  const txt = buildExport();
  let ok = false;
  try { await navigator.clipboard.writeText(txt); ok = true; } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = txt; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
    ta.remove();
  }
  if (ok) { markExported(); render(); toast(`已复制（约 ${Math.ceil(txt.length / 1024)} KB），可粘贴到备忘录或发给自己`); }
  else toast('复制失败，请改用「下载文件」');
}

function sanitize(d, inCovers) {
  const str = (v, max = 5000) => (typeof v === 'string' ? v.slice(0, max) : '');
  const books = (Array.isArray(d.books) ? d.books : []).filter((b) => b && typeof b.id === 'string' && str(b.title).trim()).map((b) => ({
    id: b.id, title: str(b.title, 200).trim(), author: str(b.author, 200), category: str(b.category, 50),
    status: STATUS[b.status] ? b.status : 'want', totalPages: posInt(b.totalPages), readPages: Math.min(posInt(b.readPages), posInt(b.totalPages) || Infinity), maxPage: posInt(b.maxPage),
    progressMode: b.progressMode === 'percent' ? 'percent' : 'page', percent: clampPct(b.percent) || 0, maxPercent: clampPct(b.maxPercent) || 0,
    startedAt: isDateKey(b.startedAt) ? b.startedAt : null, finishedAt: isDateKey(b.finishedAt) ? b.finishedAt : null,
    coverUrl: /^https?:\/\//i.test(b.coverUrl || '') ? str(b.coverUrl, 2000) : '',
    createdAt: str(b.createdAt, 40) || nowISO(), updatedAt: str(b.updatedAt, 40) || nowISO(), ...(b.sample ? { sample: true } : {}),
    ...(typeof b.wereadId === 'string' && b.wereadId ? { wereadId: str(b.wereadId, 100), source: 'weread', readingSeconds: posInt(b.readingSeconds) } : {}),
  }));
  const ids = new Set(books.map((b) => b.id));
  const notes = (Array.isArray(d.notes) ? d.notes : []).filter((n) => n && typeof n.id === 'string' && ids.has(n.bookId)).map((n) => ({
    id: n.id, bookId: n.bookId, chapter: str(n.chapter, 200), excerpt: str(n.excerpt), thought: str(n.thought), action: str(n.action),
    topics: (Array.isArray(n.topics) ? n.topics : []).filter((t) => typeof t === 'string' && t.trim()).map((t) => t.trim().slice(0, 20)),
    date: isDateKey(n.date) ? n.date : today(), createdAt: str(n.createdAt, 40) || nowISO(), updatedAt: str(n.updatedAt, 40) || nowISO(), ...(n.sample ? { sample: true } : {}),
    ...(typeof n.wereadId === 'string' && n.wereadId ? { wereadId: str(n.wereadId, 100), source: 'weread' } : {}),
  })).filter((n) => n.excerpt || n.thought || n.action);
  const logs = (Array.isArray(d.logs) ? d.logs : []).filter((l) => l && typeof l.id === 'string' && ids.has(l.bookId) && isDateKey(l.date) && (posInt(l.pages) || posInt(l.percent))).map((l) => ({
    id: l.id, bookId: l.bookId, date: l.date, pages: posInt(l.pages), ...(posInt(l.percent) ? { percent: Math.min(100, posInt(l.percent)) } : {}),
    at: str(l.at, 40) || isoAt(l.date), ...(l.sample ? { sample: true } : {}),
  }));
  const cv = {};
  for (const [k, v] of Object.entries(inCovers || {})) if (ids.has(k) && typeof v === 'string' && v.startsWith('data:image/')) cv[k] = v;
  const strList = (a) => (Array.isArray(a) ? a.filter((x) => typeof x === 'string').slice(0, 20000) : []);
  const m = d.meta || {};
  return {
    books, notes, logs, covers: cv,
    lastExportAt: typeof m.lastExportAt === 'string' ? m.lastExportAt : null,
    wrIgnoredBooks: strList(m.wrIgnoredBooks), wrIgnoredNotes: strList(m.wrIgnoredNotes),
    lastWereadSync: typeof m.lastWereadSync === 'string' ? m.lastWereadSync : null,
  };
}

/* ---------- 微信读书同步文件导入 ----------
 * 同步数据由 tools/weread-sync.user.js 在电脑上生成：{ app, kind: 'weread-sync', books[], highlights[] }
 * 规则：按微信读书编号对应；已有的书只更新进度/状态/累计时长，不改书名、分类、封面和你写的笔记；
 *       划线只新增不覆盖；删除过的书和划线不会再加回来；同步不生成阅读记录（日历只显示划线的真实日期）。 */
async function handleWereadSync(obj) {
  const str = (v, max = 500) => (typeof v === 'string' ? v.slice(0, max) : '');
  const isoOk = (v) => typeof v === 'string' && !isNaN(Date.parse(v));
  const inBooks = (Array.isArray(obj.books) ? obj.books : []).filter((b) => b && typeof b.wereadId === 'string' && b.wereadId && str(b.title).trim());
  const inHls = (Array.isArray(obj.highlights) ? obj.highlights : []).filter((h) => h && typeof h.wereadId === 'string' && typeof h.bookWereadId === 'string' && str(h.text, 5000).trim());
  if (!inBooks.length) { toast('同步文件里没有书籍'); return; }
  const ignoredB = new Set(S.meta.wrIgnoredBooks || []);
  const ignoredN = new Set(S.meta.wrIgnoredNotes || []);
  const normTitle = (s) => String(s || '').replace(/\s+/g, '').toLowerCase();

  const adds = [], updates = [], links = [];
  let skippedBooks = 0;
  for (const ib of inBooks) {
    if (ignoredB.has(ib.wereadId)) { skippedBooks++; continue; }
    const byId = S.books.find((x) => x.wereadId === ib.wereadId);
    if (byId) { updates.push([byId, ib]); continue; }
    const byTitle = S.books.find((x) => !x.wereadId && !x.sample && normTitle(x.title) === normTitle(ib.title));
    if (byTitle) links.push([byTitle, ib]); else adds.push(ib);
  }
  const haveNotes = new Set(S.notes.filter((n) => n.wereadId).map((n) => n.wereadId));
  const newHls = inHls.filter((h) => !haveNotes.has(h.wereadId) && !ignoredN.has(h.wereadId) && !ignoredB.has(h.bookWereadId));
  const skippedHls = inHls.length - newHls.length;

  const when = isoOk(obj.exportedAt) ? fmtDate(dateKey(new Date(obj.exportedAt)), true) : '未知时间';
  const msg = `同步文件生成于 ${when}<br>新增 <b>${adds.length}</b> 本书，更新 <b>${updates.length + links.length}</b> 本` +
    (links.length ? `（其中 ${links.length} 本与书架上的同名书关联）` : '') +
    `<br>新增 <b>${newHls.length}</b> 条划线` + (skippedHls ? `，${skippedHls} 条已存在或删除过，跳过` : '') +
    (skippedBooks ? `<br>${skippedBooks} 本书你删除过，跳过` : '') +
    '<br><br>你在工作台里写的感悟、改过的书名和分类不会被覆盖。同步前会自动保存快照。';
  if (!(await confirmBox('微信读书同步', msg, '开始同步'))) return;
  await snapshot('同步前');

  const t = nowISO();
  const later = (a, b) => (isoOk(b) && (!a || b > a) ? b : a);
  const pctOf = (ib) => (ib.finished ? 100 : (Number.isNaN(clampPct(ib.progress)) ? 0 : clampPct(ib.progress)));
  const coverOf = (ib) => (/^https?:\/\//i.test(ib.cover || '') ? str(ib.cover, 2000) : '');
  const updateFrom = (b, ib) => {
    b.wereadId = ib.wereadId;
    b.source = 'weread';
    b.readingSeconds = posInt(ib.readingSeconds);
    if (isPct(b)) { const p = pctOf(ib); b.percent = p; b.maxPercent = Math.max(b.maxPercent || 0, p); }
    if (ib.finished && b.status !== 'done') { b.status = 'done'; b.finishedAt = isDateKey(ib.finishDate) ? ib.finishDate : null; }
    else if (!ib.finished && (b.status === 'want' || b.status === 'paused') && pctOf(ib) > 0) b.status = 'reading';
    if (!b.startedAt && isDateKey(ib.startDate)) b.startedAt = ib.startDate;
    if (!b.coverUrl && !covers[b.id] && coverOf(ib)) b.coverUrl = coverOf(ib);
    b.updatedAt = later(b.updatedAt, ib.lastReadAt);
    delete b.sample;
  };
  for (const [b, ib] of [...updates, ...links]) updateFrom(b, ib);
  for (const ib of adds) {
    const p = pctOf(ib);
    S.books.push({
      id: uid(), title: str(ib.title, 200).trim(), author: str(ib.author, 200), category: str(ib.category, 50),
      status: ib.finished ? 'done' : p > 0 ? 'reading' : 'want',
      totalPages: 0, readPages: 0, maxPage: 0, progressMode: 'percent', percent: p, maxPercent: p,
      startedAt: isDateKey(ib.startDate) ? ib.startDate : null,
      finishedAt: ib.finished && isDateKey(ib.finishDate) ? ib.finishDate : null,
      coverUrl: coverOf(ib), wereadId: ib.wereadId, source: 'weread', readingSeconds: posInt(ib.readingSeconds),
      createdAt: t, updatedAt: isoOk(ib.lastReadAt) ? ib.lastReadAt : t,
    });
  }
  const localId = new Map(S.books.filter((b) => b.wereadId).map((b) => [b.wereadId, b.id]));
  let added = 0;
  for (const h of newHls) {
    const bookId = localId.get(h.bookWereadId);
    if (!bookId) continue;
    const date = isDateKey(h.date) && h.date <= today() ? h.date : today();
    const at = isoOk(h.createdAt) ? h.createdAt : isoAt(date);
    S.notes.push({ id: uid(), bookId, chapter: str(h.chapter, 200), excerpt: str(h.text, 5000).trim(), thought: '', action: '', topics: [], date, createdAt: at, updatedAt: at, source: 'weread', wereadId: h.wereadId });
    added++;
  }
  S.meta.lastWereadSync = t;
  await save();
  toast(`同步完成：新增 ${adds.length} 本书、${added} 条划线`);
  closeSheet();
  go('home');
}

async function handleImport(text) {
  let obj;
  try { obj = JSON.parse(text); } catch (e) { toast('文件内容不是有效的备份（JSON 解析失败）'); return; }
  if (obj && obj.app === APP_ID && obj.kind === 'weread-sync') { await handleWereadSync(obj); return; }
  if (!obj || obj.app !== APP_ID || !obj.data || !Array.isArray(obj.data.books)) { toast('这不是「我的阅读空间」的备份文件'); return; }
  if (obj.version > SCHEMA) { toast('备份来自更新的版本，请先更新本页面'); return; }
  const inc = sanitize(obj.data, obj.covers);
  const when = obj.exportedAt ? fmtDate(dateKey(new Date(obj.exportedAt)), true) : '未知时间';
  const msg = `备份时间：${when}<br>包含 <b>${inc.books.length}</b> 本书、<b>${inc.notes.length}</b> 条笔记、<b>${inc.logs.length}</b> 条阅读记录。<br><br><b>覆盖</b>：用备份替换当前全部数据。<br><b>合并</b>：保留当前数据，补入备份里的内容（同一条记录取较新的）。`;
  const mode = await dialog('导入备份', msg, [
    { label: '覆盖当前数据', value: 'replace', cls: 'primary' },
    { label: '合并到当前数据', value: 'merge' },
    { label: '取消', value: null, cls: 'ghost' },
  ]);
  if (!mode) return;
  await snapshot('导入前');
  if (mode === 'replace') {
    S = { version: SCHEMA, books: inc.books, notes: inc.notes, logs: inc.logs, meta: { ...S.meta, seeded: true, lastExportAt: inc.lastExportAt || S.meta.lastExportAt, wrIgnoredBooks: inc.wrIgnoredBooks, wrIgnoredNotes: inc.wrIgnoredNotes, lastWereadSync: inc.lastWereadSync || S.meta.lastWereadSync } };
    covers = inc.covers;
  } else {
    const mergeBy = (cur, add, useTime) => {
      const m = new Map(cur.map((x) => [x.id, x]));
      const won = new Set();
      for (const x of add) {
        const old = m.get(x.id);
        if (!old || (useTime && x.updatedAt > old.updatedAt)) { m.set(x.id, x); won.add(x.id); }
      }
      return [[...m.values()], won];
    };
    const [books, wonBooks] = mergeBy(S.books, inc.books, true);
    S.books = books;
    [S.notes] = mergeBy(S.notes, inc.notes, true);
    [S.logs] = mergeBy(S.logs, inc.logs, false);
    for (const [k, v] of Object.entries(inc.covers)) if (wonBooks.has(k) || !covers[k]) covers[k] = v;
  }
  await save(true);
  toast(mode === 'replace' ? '导入完成' : '合并完成');
  closeSheet();
  go('home');
}

async function snapshot(reason) {
  const snap = { at: nowISO(), reason, state: JSON.parse(JSON.stringify(S)), covers: { ...covers } };
  try { await kv.set('backup', snap); ui.backupInfo = `${fmtDate(dateKey(new Date(snap.at)), true)}${reason}`; } catch (e) { console.error(e); }
}
async function loadBackupInfo() {
  try {
    const b = await kv.get('backup');
    ui.backupInfo = b ? `${fmtDate(dateKey(new Date(b.at)), true)}${b.reason}` : '';
  } catch (e) { ui.backupInfo = ''; }
}
async function restoreBackup() {
  const b = await kv.get('backup');
  if (!b) { toast('没有可恢复的快照'); return; }
  if (!(await confirmBox('恢复快照？', `将恢复到 ${esc(ui.backupInfo)} 的状态。当前数据会被换成快照；你也可以再次点「恢复」换回来。`, '恢复'))) return;
  const cur = { at: nowISO(), reason: '恢复前', state: JSON.parse(JSON.stringify(S)), covers: { ...covers } };
  S = b.state; covers = b.covers || {};
  await kv.set('backup', cur);
  ui.backupInfo = `${fmtDate(today(), true)}恢复前`;
  await save(true);
  toast('已恢复');
  render();
  fillSettingsInfo();
}

async function clearSample() {
  if (!(await confirmBox('清空示例数据？', '只删除示例书籍、笔记和阅读记录，你自己添加或修改过的内容会保留。', '清空示例'))) return;
  const ids = new Set(S.books.filter((b) => b.sample).map((b) => b.id));
  S.books = S.books.filter((b) => !b.sample);
  S.notes = S.notes.filter((n) => !n.sample && !ids.has(n.bookId));
  S.logs = S.logs.filter((l) => !l.sample && !ids.has(l.bookId));
  for (const id of ids) delete covers[id];
  S.meta.seeded = true;
  await save(true);
  toast('示例数据已清空，开始记录你自己的阅读吧');
  render();
}
async function clearAll() {
  if (!(await confirmBox('清空全部数据？', '书籍、笔记、阅读记录和封面都会被删除。<br>清空前会自动保存一份快照，可以在本页「恢复」。', '全部清空', true))) return;
  await snapshot('清空前');
  S = emptyState();
  covers = {};
  await save(true);
  toast('已清空全部数据');
  render();
  fillSettingsInfo();
}

async function importFromClipboard() {
  let text = '';
  try {
    if (!navigator.clipboard || !navigator.clipboard.readText) throw new Error('unsupported');
    text = (await navigator.clipboard.readText()).trim();
  } catch (e) {
    toast('无法直接读取剪贴板，请手动粘贴');
    openPasteImport();
    return;
  }
  if (!text) { toast('剪贴板是空的，请先在电脑上复制'); return; }
  if (!text.startsWith('{')) { toast('剪贴板里不是阅读空间的数据，请先在电脑上复制'); return; }
  handleImport(text);
}
function openPasteImport() {
  openSheet('粘贴文本导入', `
    <div class="field"><label for="paste-ta">把复制得到的备份或同步数据粘贴到这里</label><textarea id="paste-ta" style="min-height:180px;font-family:monospace;font-size:13px" placeholder='{"app":"reading-space", ...}'></textarea></div>
    <button class="btn primary block" id="paste-go">导入</button>`, (root) => {
    $('#paste-go', root).addEventListener('click', () => {
      const v = $('#paste-ta', root).value.trim();
      if (!v) { toast('请先粘贴备份内容'); return; }
      handleImport(v);
    });
  });
}

/* ---------- 事件分发 ---------- */
const actions = {
  'go': (el) => go(el.dataset.to),
  'back': () => { if (navCount > 0) history.back(); else go(ui.route === 'book' ? 'shelf' : 'home'); },
  'close-sheet': () => closeSheet(),
  'add-book': () => openBookForm(),
  'edit-book': (el) => openBookForm(el.dataset.id),
  'del-book': (el) => deleteBook(el.dataset.id),
  'progress': (el) => openProgress(el.dataset.id),
  'pick-progress': () => pickProgress(),
  'add-note': (el) => openNoteForm(null, el.dataset.book || (ui.route === 'book' ? ui.param : '')),
  'edit-note': (el) => openNoteForm(el.dataset.id),
  'del-note': (el) => deleteNote(el.dataset.id),
  'cal-prev': () => { const m = ui.calMonth; ui.calMonth = new Date(m.getFullYear(), m.getMonth() - 1, 1); $('#cal-card').innerHTML = calendarHTML(); },
  'cal-next': () => {
    const m = ui.calMonth, n = new Date();
    if (m.getFullYear() === n.getFullYear() && m.getMonth() === n.getMonth()) return;
    ui.calMonth = new Date(m.getFullYear(), m.getMonth() + 1, 1); $('#cal-card').innerHTML = calendarHTML();
  },
  'cal-day': (el) => openDay(el.dataset.date),
  'shelf-status': (el) => { ui.shelfStatus = el.dataset.v; render(); },
  'shelf-cat': (el) => { ui.shelfCat = el.dataset.v; render(); },
  'notes-book': (el) => { ui.notesBook = el.dataset.v; render(); },
  'kb-topic': (el) => {
    ui.kbTopic = el.dataset.v;
    const box = $('#kb-topics');
    if (box) { const x = box.scrollLeft; box.innerHTML = kbTopicsHTML(allTopics()); box.scrollLeft = x; }
    $('#kb-results').innerHTML = kbResultsHTML();
  },
  'export-share': () => exportShare(),
  'export-download': () => exportDownload(),
  'export-copy': () => exportCopy(),
  'import-file': () => { const i = $('#file-import'); i.value = ''; i.click(); },
  'import-paste': () => openPasteImport(),
  'import-clipboard': () => importFromClipboard(),
  'restore-backup': () => restoreBackup(),
  'clear-sample': () => clearSample(),
  'clear-all': () => clearAll(),
  'persist': async () => {
    try {
      const ok = await navigator.storage.persist();
      toast(ok ? '已开启持久化存储' : '浏览器暂未同意。添加到主屏幕并经常使用后，通常会自动开启');
    } catch (e) { toast('浏览器不支持'); }
    fillSettingsInfo();
  },
  'a2hs-help': () => openSheet('添加到主屏幕', `<div class="prose">${a2hsHelpHTML()}</div>`),
  'a2hs-hide': () => { S.meta.hideA2HS = true; save(); render(); },
  'set-accent': (el) => { setAccent(el.dataset.v); render(); },
  'set-theme': (el) => { setTheme(el.dataset.v); render(); },
};
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});
$('#file-import').addEventListener('change', async (e) => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  try { handleImport(await f.text()); } catch (err) { toast('读取文件失败'); }
});

/* ---------- 启动 ---------- */
async function boot() {
  await kv.init();
  try {
    const st = await kv.get('state');
    if (st && Array.isArray(st.books)) {
      S = { ...emptyState(), ...st, meta: { ...emptyState().meta, ...(st.meta || {}) } };
      covers = (await kv.get('covers')) || {};
    } else {
      seedSample();
      await save(true);
    }
  } catch (e) {
    console.error(e);
    toast('读取本地数据失败');
  }
  await loadBackupInfo();
  if (kv.mode === 'memory') toast('当前浏览器无法保存数据（可能是无痕模式），刷新后会丢失');
  try { if (navigator.storage && navigator.storage.persist && !(await navigator.storage.persisted())) navigator.storage.persist(); } catch (e) { /* 忽略 */ }
  parseRoute();
  render();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}
boot();
</script>
